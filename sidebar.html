<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HORIZON Sidebar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }
    
    #root {
      width: 100%;
      height: 100%;
    }
    
    .sidebar-container {
      width: 100%;
      height: 100%;
      background: rgba(8, 16, 28, 0.85);
      backdrop-filter: blur(16px);
      border-radius: 12px;
      border: 1px solid rgba(120, 160, 200, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      gap: 8px;
      -webkit-app-region: drag;
    }
    
    .sidebar-item {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      background: rgba(20, 40, 60, 0.6);
      border: 1px solid rgba(120, 160, 200, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-app-region: no-drag;
    }
    
    .sidebar-item:hover {
      background: rgba(38, 100, 169, 0.4);
      border-color: rgba(38, 100, 169, 0.6);
      transform: scale(1.05);
    }
    
    .sidebar-item:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/sidebar.tsx"></script>
</body>
</html>
