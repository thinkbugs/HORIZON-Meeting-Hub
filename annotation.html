<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HORIZON Annotation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgba(2, 6, 12, 0.7);
      backdrop-filter: blur(8px);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }
    
    #root {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    .annotation-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    
    .annotation-toolbar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      padding: 12px 20px;
      background: rgba(8, 16, 28, 0.92);
      backdrop-filter: blur(16px);
      border-radius: 12px;
      border: 1px solid rgba(120, 160, 200, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      z-index: 1000;
    }
    
    .toolbar-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid rgba(120, 160, 200, 0.2);
      background: rgba(20, 40, 60, 0.6);
      color: rgba(200, 220, 240, 0.9);
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    
    .toolbar-btn:hover {
      background: rgba(38, 100, 169, 0.4);
      border-color: rgba(38, 100, 169, 0.6);
    }
    
    .toolbar-btn.active {
      background: rgba(38, 100, 169, 0.6);
      border-color: rgba(38, 100, 169, 0.8);
    }
    
    .color-picker {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    
    .color-swatch {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }
    
    .color-swatch:hover {
      transform: scale(1.1);
    }
    
    .color-swatch.active {
      border-color: white;
    }
    
    .size-slider {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .size-slider input {
      width: 80px;
    }
  </style>
</head>
<body>
  <div id="root">
    <canvas class="annotation-canvas" id="canvas"></canvas>
    <div class="annotation-toolbar">
      <button class="toolbar-btn active" id="pen-btn">✏️ 画笔</button>
      <button class="toolbar-btn" id="eraser-btn">🧹 橡皮</button>
      <div class="color-picker">
        <div class="color-swatch active" style="background: #ff3b30;" data-color="#ff3b30"></div>
        <div class="color-swatch" style="background: #ff9500;" data-color="#ff9500"></div>
        <div class="color-swatch" style="background: #ffcc00;" data-color="#ffcc00"></div>
        <div class="color-swatch" style="background: #34c759;" data-color="#34c759"></div>
        <div class="color-swatch" style="background: #007aff;" data-color="#007aff"></div>
        <div class="color-swatch" style="background: #af52de;" data-color="#af52de"></div>
      </div>
      <div class="size-slider">
        <span style="color: rgba(200, 220, 240, 0.9); font-size: 12px;">粗细:</span>
        <input type="range" id="size-slider" min="1" max="20" value="3">
      </div>
      <button class="toolbar-btn" id="undo-btn">↩️ 撤销</button>
      <button class="toolbar-btn" id="clear-btn">🗑️ 清空</button>
      <button class="toolbar-btn" id="save-btn">💾 保存</button>
      <button class="toolbar-btn" id="close-btn" style="background: rgba(255, 59, 48, 0.3); border-color: rgba(255, 59, 48, 0.5);">✖️ 关闭</button>
    </div>
  </div>
  
  <script type="module" src="./src/annotation.tsx"></script>
</body>
</html>
